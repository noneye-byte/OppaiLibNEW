<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191410" />
    <title>OppaiLib</title>
    <!-- The vector mark first: browsers that take it get a crisp icon at any size and
         the PNGs below stay as the fallback for the ones that don't. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Fonts are served from /media's own host, not Google's.
         Two reasons, and the second is the one that bites: a stylesheet link to
         fonts.googleapis.com tells Google the IP of every household running this
         and when they opened it, which is the opposite of what this app promises;
         and on a LAN-only or offline Unraid box the request simply never returns,
         so the icon font never arrives and every button reads as the word
         "play_arrow". Vendored in web/public/fonts — see the README there for how
         to refresh them. -->
    <link rel="preload" href="./fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="./fonts/material-symbols-rounded.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Variable weight axis: the UI asks for 400/500/600/700 and interpolates. */
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("fonts/roboto-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("fonts/roboto-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Icons, subset to the 235 glyph names the source actually asks for.
         Two static instances rather than one variable font: the app only ever
         draws the outlined and the filled weight, and two instances are 57 kB
         against 315 kB for the variable face carrying axes nothing sweeps. */
      @font-face {
        font-family: "Material Symbols Rounded";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("fonts/material-symbols-rounded.woff2") format("woff2");
      }
      @font-face {
        font-family: "Material Symbols Rounded Fill";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("fonts/material-symbols-rounded-fill.woff2") format("woff2");
      }
    </style>
    <script type="module" crossorigin src="./assets/index-XPJwO1lq.js"></script>
  </head>
  <body>
    <oppai-app></oppai-app>
  </body>
</html>
