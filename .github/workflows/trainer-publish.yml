name: Publish Trainer Image

# The LoRA trainer (trainer/) is its own image: PyTorch, CUDA and sd-scripts, some
# 6 GB, wanted only on a box with an NVIDIA GPU. It changes rarely, so it is built
# when its own files change rather than with every release of the app — and by
# hand (workflow_dispatch) when it needs rebuilding for a new base image.

on:
  push:
    branches: [main]
    paths:
      - "trainer/**"
      - ".github/workflows/trainer-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trainer-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: noneye-byte/oppailib-trainer

jobs:
  # The request handling, the argument building and a whole job through the HTTP
  # API, with a stand-in for sd-scripts: everything but the GPU.
  test:
    name: Trainer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        working-directory: trainer
        run: python -m unittest -v test_server.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The PyTorch base image alone unpacks to ~8 GB, and the runner starts with
      # about 14 GB free. The toolchains removed here are ones this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' unraid/oppailib.xml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      # No layer cache: the repository's 10 GB of Actions cache is the app image's,
      # and one copy of this one would evict all of it.
      - name: Build and publish trainer image
        uses: docker/build-push-action@v6
        with:
          context: trainer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
